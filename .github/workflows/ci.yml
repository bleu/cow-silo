name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: forge fmt --check
      - run: FOUNDRY_PROFILE=ci forge test
      - run: TEST_ISOLATED=true forge test --isolate --match-test testPreparationExpiresAfterTransaction
      - run: pnpm --filter @cow-silo/sdk typecheck
      - run: pnpm --filter @cow-silo/sdk test
      - run: pnpm build
