[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.mainnet]
test = "integration/mainnet"

[profile.ci]
fuzz = { runs = 2_000 }
invariant = { runs = 256, depth = 64 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
